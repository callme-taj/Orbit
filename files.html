<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBIT Files</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="spaceCanvas"></canvas><div class="space-vignette"></div><header class="navbar"><a class="brand" href="index.html">ORB<span>IT</span></a><button class="menu-btn" id="menuBtn">☰</button><nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="games.html">Games</a><a href="notes.html">Notes</a><a class="active" href="files.html">Files</a><a href="social.html">Social</a><a href="request.html">Request</a><a href="about.html">About</a><a href="login.html">Login</a></nav></header><main><section class="page-hero reveal"><h1>RESOURCE VAULT</h1><p>Use the local uploader below as a prototype. It stores files in this browser only; shared admin uploads need a real backend such as Firebase Storage.</p></section><section class="section"><div class="container"><div class="file-drop reveal"><label class="btn" for="fileInput">📤 Select Photos / Videos / Files</label><input id="fileInput" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.ppt,.pptx,.txt,.zip"><div style="color:#718197;font-size:11px;margin-top:10px">Prototype storage: local browser only.</div></div><div id="fileGrid" class="file-grid"></div></div></section></main><footer><div class="footer-orbit"></div><div class="footer-brand">ORB<span>IT</span></div><div class="footer-copy">Resource Vault • Local prototype</div></footer><button id="topBtn">↑</button><script src="app.js"></script><script>
const input=document.getElementById('fileInput'),grid=document.getElementById('fileGrid');let items=getStored('orbitLocalFiles',[]);function render(){grid.innerHTML=items.map((f,i)=>`<div class="file-card"><div class="file-preview">${f.type.startsWith('image/')?`<img src="${f.data}" alt="">`:f.type.startsWith('video/')?`<video controls src="${f.data}"></video>`:'📄'}</div><b style="font-size:12px">${f.name}</b><div style="color:#718197;font-size:10px;margin-top:5px">${f.sizeLabel}</div><button class="btn danger" style="margin-top:10px;width:100%" onclick="removeFile(${i})">Delete</button></div>`).join('')||'<div style="color:#718197;font-size:12px;grid-column:1/-1;text-align:center;padding:30px">No local files yet.</div>'}function removeFile(i){items.splice(i,1);setStored('orbitLocalFiles',items);render();toast('File removed')}
input.addEventListener('change',async e=>{for(const file of e.target.files){if(file.size>2_000_000){toast(file.name+' is over the 2 MB demo limit');continue}const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});items.unshift({name:file.name,type:file.type,sizeLabel:(file.size/1024).toFixed(1)+' KB',data});}try{setStored('orbitLocalFiles',items);render();toast('Files added to local vault')}catch{toast('Local storage is full; use a real storage backend for larger files')}e.target.value=''});render();</script></body></html>
