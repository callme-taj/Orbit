<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBIT Games</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="spaceCanvas"></canvas><div class="space-vignette"></div><header class="navbar"><a class="brand" href="index.html">ORB<span>IT</span></a><button class="menu-btn" id="menuBtn">☰</button><nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a class="active" href="games.html">Games</a><a href="notes.html">Notes</a><a href="files.html">Files</a><a href="social.html">Social</a><a href="request.html">Request</a><a href="about.html">About</a><a href="login.html">Login</a></nav></header><main><section class="page-hero reveal"><h1>GAME SECTOR</h1><p>Search, filter and launch the games currently listed in your ORBIT interface.</p></section><section class="section"><div class="container"><div class="toolbar reveal"><input class="search" id="gameSearch" placeholder="Search games..."><div class="filters"><button class="filter active" data-cat="all">All</button><button class="filter" data-cat="Arcade">Arcade</button><button class="filter" data-cat="Puzzle">Puzzle</button><button class="filter" data-cat="Strategy">Strategy</button></div></div><div class="actions" style="justify-content:flex-start;margin:0 0 18px"><button class="btn" id="randomGame">🎲 Random Mission</button></div><div class="game-grid" id="gameGrid"></div><div id="noGames" style="display:none;text-align:center;color:#738197;padding:40px">No matching games found.</div></div></section></main><footer><div class="footer-orbit"></div><div class="footer-brand">ORB<span>IT</span></div><div class="footer-links"><a href="index.html">Home</a><a href="social.html">Social</a><a href="request.html">Request</a></div><div class="footer-copy">Game Sector • ORBIT</div></footer><button id="topBtn">↑</button><div id="modal"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" id="closeModal">✕</button></div><div class="modal-body" id="modalBody"></div></div></div><script src="app.js"></script><script>
const games=[
 {n:'Space Runner',c:'Arcade',i:'🚀',d:'Navigate a cosmic track and dodge hazards.'},{n:'Quantum Puzzle',c:'Puzzle',i:'🧩',d:'Solve glowing logic challenges.'},{n:'Planet Commander',c:'Strategy',i:'🪐',d:'Plan missions across distant worlds.'},{n:'Meteor Rush',c:'Arcade',i:'☄️',d:'Avoid incoming meteors and survive.'},{n:'Star Maze',c:'Puzzle',i:'🌟',d:'Find the path through an evolving star maze.'},{n:'Galaxy Architect',c:'Strategy',i:'🌌',d:'Design a small interstellar civilization.'},{n:'Neon Orbit',c:'Arcade',i:'💫',d:'Keep your ship inside the orbital corridor.'},{n:'Signal Decode',c:'Puzzle',i:'📡',d:'Decode mysterious deep-space signals.'}
];
const grid=document.getElementById('gameGrid'); const search=document.getElementById('gameSearch'); let cat='all';
function render(){const q=search.value.trim().toLowerCase();let list=games.filter(g=>(cat==='all'||g.c===cat)&&(`${g.n} ${g.d}`.toLowerCase().includes(q)));grid.innerHTML=list.map((g,i)=>`<article class="game reveal active"><div class="game-cover">${g.i}</div><h3>${g.n}</h3><p>${g.d}</p><div class="game-meta"><span>${g.c}</span><span>⭐ ${(4.6+i%4/10).toFixed(1)}</span></div><button class="btn" onclick="launch('${g.n}','${g.i}')">🚀 Launch</button></article>`).join('');document.getElementById('noGames').style.display=list.length?'none':'block'}
function launch(name,icon){openModal(name,`<div style="font-size:44px;margin-bottom:10px">${icon}</div><p>Mission interface ready for <b>${name}</b>. This demo launch button is wired to the ORBIT frontend. Replace the launch action later with the URL or embedded game you want to use.</p><button class="btn" onclick="closeModal();toast('Mission launched: ${name.replace(/'/g,'')}')">Start</button>`)}
search.addEventListener('input',render); document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()}));document.getElementById('randomGame').addEventListener('click',()=>{const g=games[Math.floor(Math.random()*games.length)];launch(g.n,g.i)});render();</script></body></html>
