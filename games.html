<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02030a"><title>ORBIT — Games</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="spaceCanvas"></canvas><div class="space-vignette"></div><header class="navbar"><a class="brand" href="index.html">ORB<span>IT</span></a><button class="menu-btn" id="menuBtn">☰</button><nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="games.html">Games</a><a href="notes.html">Notes</a><a href="files.html">Files</a><a href="social.html">Social</a><a href="request.html">Request</a><a href="about.html">About</a><a href="login.html">Login</a></nav></header><main><section class="hero"><div class="hero-inner reveal"><div class="pill"><span class="dot"></span> GAME DECK ONLINE</div><h1>GAME STATION</h1><p>Search, filter and favorite the games in your ORBIT deck.</p><div class="space-hud"><div class="hud"><b id="totalGames">0</b><small>Total Games</small></div><div class="hud"><b id="shownGames">0</b><small>Showing</small></div><div class="hud"><b id="favGames">0</b><small>Favorites</small></div><div class="hud"><b>ONLINE</b><small>Game Core</small></div></div></div></section><section class="section"><div class="container"><div class="form reveal"><input id="gameSearch" placeholder="🔍 Search games..."><div class="actions" style="justify-content:flex-start"><button class="btn ghost filter" data-cat="all">All</button><button class="btn ghost filter" data-cat="arcade">Arcade</button><button class="btn ghost filter" data-cat="puzzle">Puzzle</button><button class="btn ghost filter" data-cat="action">Action</button><button class="btn ghost filter" data-cat="strategy">Strategy</button><button class="btn ghost filter" data-cat="racing">Racing</button></div></div><div id="gameGrid" class="card-grid" style="margin-top:18px"></div></div></section><script>const G=[["Nova Drift","arcade","🚀"],["Neon Blocks","puzzle","🧩"],["Orbit Runner","action","🏃"],["Galaxy Tactics","strategy","♟️"],["Star Racer","racing","🏎️"],["Cosmic Match","arcade","🌌"],["Astro Defender","action","🛡️"],["Quantum Tiles","puzzle","🔷"],["Meteor Rush","arcade","☄️"],["Planet Pilot","racing","🪐"],["Void Racer","racing","🏁"],["Command Orbit","strategy","🛰️"]];let GF=JSON.parse(localStorage.getItem("orbitGameFavorites")||"[]"),GC="all";function renderG(){let q=$("#gameSearch").value.toLowerCase(),a=G.filter(g=>(GC==="all"||g[1]===GC)&&g[0].toLowerCase().includes(q));$("#gameGrid").innerHTML=a.map(g=>{let f=GF.includes(g[0]);return `<div class="card reveal active"><div class="icon">${g[2]}</div><h3>${g[0]}</h3><p>${g[1]} game slot.</p><button class="btn" onclick="alert('Launch slot: ${g[0]}')">🚀 Launch</button> <button class="btn ghost" onclick="favG('${g[0]}')">${f?"★":"☆"}</button></div>`}).join("");$("#totalGames").textContent=G.length;$("#shownGames").textContent=a.length;$("#favGames").textContent=GF.length}function favG(n){GF=GF.includes(n)?GF.filter(x=>x!==n):[...GF,n];localStorage.setItem("orbitGameFavorites",JSON.stringify(GF));renderG()}$("#gameSearch").oninput=renderG;$$(".filter").forEach(b=>b.onclick=()=>{GC=b.dataset.cat;$$(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderG()});renderG();</script></main><footer><div class="footer-orbit"></div><div class="footer-brand">ORB<span>IT</span></div><div class="footer-links"><a href="index.html">Home</a><a href="games.html">Games</a><a href="notes.html">Notes</a><a href="files.html">Files</a><a href="social.html">Social</a><a href="request.html">Request</a><a href="about.html">About</a></div><div class="footer-copy">ORBIT • Personal digital space</div></footer><button id="topBtn">↑</button><script src="script.js"></script></body></html>
