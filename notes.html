<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#02030a"><title>ORBIT — Notes</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="spaceCanvas"></canvas><div class="space-vignette"></div><header class="navbar"><a class="brand" href="index.html">ORB<span>IT</span></a><button class="menu-btn" id="menuBtn">☰</button><nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="games.html">Games</a><a href="notes.html">Notes</a><a href="files.html">Files</a><a href="social.html">Social</a><a href="request.html">Request</a><a href="about.html">About</a><a href="login.html">Login</a></nav></header><main><section class="hero"><div class="hero-inner reveal"><div class="pill"><span class="dot"></span> NOTE CORE ONLINE</div><h1>NOTES</h1><p>Create, edit, search and save notes locally.</p></div></section><section class="section"><div class="container"><div class="form reveal"><label>Title</label><input id="noteTitle" placeholder="Note title"><label>Content</label><textarea id="noteBody" placeholder="Write your note..."></textarea><button id="saveNote" class="btn">💾 Save Note</button></div><input class="searchbar" id="noteSearch" style="margin-top:20px" placeholder="🔍 Search notes..."><div id="noteList" class="list-grid" style="margin-top:18px"></div></div></section><script>let N=JSON.parse(localStorage.getItem("orbitNotes")||"[]"),edit=-1;function renderN(){let q=$("#noteSearch").value.toLowerCase();$("#noteList").innerHTML=N.filter(n=>(n.t+" "+n.b).toLowerCase().includes(q)).map((n,i)=>`<div class="card"><h3>${n.t}</h3><p>${n.b.replace(/</g,"&lt;")}</p><small>${n.d}</small><br><button class="btn ghost" onclick="editN(${i})">Edit</button> <button class="btn ghost" onclick="delN(${i})">Delete</button></div>`).join("")}function editN(i){edit=i;$("#noteTitle").value=N[i].t;$("#noteBody").value=N[i].b;scrollTo({top:130,behavior:"smooth"})}function delN(i){N.splice(i,1);localStorage.setItem("orbitNotes",JSON.stringify(N));renderN()}$("#saveNote").onclick=()=>{let t=$("#noteTitle").value.trim(),b=$("#noteBody").value.trim();if(!t&&!b)return alert("Write a note first.");let n={t,b,d:new Date().toLocaleString()};edit<0?N.unshift(n):N[edit]=n;edit=-1;localStorage.setItem("orbitNotes",JSON.stringify(N));$("#noteTitle").value="";$("#noteBody").value="";renderN()};$("#noteSearch").oninput=renderN;renderN();</script></main><footer><div class="footer-orbit"></div><div class="footer-brand">ORB<span>IT</span></div><div class="footer-links"><a href="index.html">Home</a><a href="games.html">Games</a><a href="notes.html">Notes</a><a href="files.html">Files</a><a href="social.html">Social</a><a href="request.html">Request</a><a href="about.html">About</a></div><div class="footer-copy">ORBIT • Personal digital space</div></footer><button id="topBtn">↑</button><script src="script.js"></script></body></html>
