<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBIT Notes</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="spaceCanvas"></canvas><div class="space-vignette"></div><header class="navbar"><a class="brand" href="index.html">ORB<span>IT</span></a><button class="menu-btn" id="menuBtn">☰</button><nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="games.html">Games</a><a class="active" href="notes.html">Notes</a><a href="files.html">Files</a><a href="social.html">Social</a><a href="request.html">Request</a><a href="about.html">About</a><a href="login.html">Login</a></nav></header><main><section class="page-hero reveal"><h1>NEURAL NOTES</h1><p>Write, save and organize notes directly in your browser. Notes are stored locally on this device until you add a real backend.</p></section><section class="section"><div class="container notes-layout"><div class="panel reveal"><div class="actions" style="justify-content:flex-start;margin:0 0 12px"><button class="btn" id="newNote">＋ New Note</button></div><div id="noteList" class="notes-list"></div></div><div class="panel editor reveal"><input id="noteTitle" class="search" style="margin-bottom:12px" placeholder="Note title"><textarea id="noteBody" placeholder="Write your note..."></textarea><div class="actions" style="justify-content:flex-start"><button class="btn" id="saveNote">💾 Save Note</button><button class="btn ghost" id="deleteNote">Delete</button></div></div></div></section></main><footer><div class="footer-orbit"></div><div class="footer-brand">ORB<span>IT</span></div><div class="footer-copy">Neural Notes • Local browser storage</div></footer><button id="topBtn">↑</button><script src="app.js"></script><script>
let notes=getStored('orbitNotes',[{id:Date.now(),title:'Welcome',body:'This is your first ORBIT note.'}]);let current=null;const list=document.getElementById('noteList'),title=document.getElementById('noteTitle'),body=document.getElementById('noteBody');
function renderNotes(){list.innerHTML=notes.map(n=>`<div class="note-item ${n.id===current?'active':''}" onclick="openNote(${n.id})"><b>${n.title||'Untitled'}</b><div style="color:#6f7f95;font-size:11px;margin-top:4px">${new Date(n.id).toLocaleString()}</div></div>`).join('')}
function openNote(id){current=id;const n=notes.find(x=>x.id===id);if(n){title.value=n.title;body.value=n.body;renderNotes()}}
document.getElementById('newNote').onclick=()=>{current=Date.now();notes.unshift({id:current,title:'New Note',body:''});setStored('orbitNotes',notes);openNote(current);toast('New note created')};document.getElementById('saveNote').onclick=()=>{if(!current)return;const n=notes.find(x=>x.id===current);n.title=title.value.trim()||'Untitled';n.body=body.value;setStored('orbitNotes',notes);renderNotes();toast('Note saved locally')};document.getElementById('deleteNote').onclick=()=>{if(!current)return;notes=notes.filter(x=>x.id!==current);setStored('orbitNotes',notes);current=null;title.value='';body.value='';renderNotes();toast('Note deleted')};renderNotes();if(notes[0])openNote(notes[0].id);
</script></body></html>
