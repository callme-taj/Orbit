<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORBIT Request Center</title><link rel="stylesheet" href="styles.css"></head><body><canvas id="spaceCanvas"></canvas><div class="space-vignette"></div><header class="navbar"><a class="brand" href="index.html">ORB<span>IT</span></a><button class="menu-btn" id="menuBtn">☰</button><nav class="nav-links" id="navLinks"><a href="index.html">Home</a><a href="games.html">Games</a><a href="notes.html">Notes</a><a href="files.html">Files</a><a href="social.html">Social</a><a class="active" href="request.html">Request</a><a href="about.html">About</a><a href="login.html">Login</a></nav></header><main><section class="page-hero reveal"><h1>REQUEST CENTER</h1><p>Ask for a new feature, a study file, a photo/video, or anything you want added to ORBIT.</p></section><section class="section"><div class="container"><div class="panel reveal"><form id="requestForm" class="form-grid"><div class="field"><label>Your name</label><input id="reqName" required placeholder="Your name"></div><div class="field"><label>Contact</label><input id="reqContact" placeholder="Email / Telegram / WhatsApp"></div><div class="field"><label>Request type</label><select id="reqType"><option>Feature</option><option>File</option><option>Photo / Video</option><option>Study Material</option><option>Other</option></select></div><div class="field"><label>Priority</label><select id="reqPriority"><option>Normal</option><option>High</option></select></div><div class="field full"><label>Request</label><textarea id="reqText" required placeholder="Describe what you want added..."></textarea></div><div class="field full"><button class="btn" type="submit">📡 Send Request</button></div></form></div><div class="panel reveal" style="margin-top:16px"><h3>Saved local requests</h3><div id="requestList" style="margin-top:12px;display:grid;gap:8px"></div></div></div></section></main><footer><div class="footer-orbit"></div><div class="footer-brand">ORB<span>IT</span></div><div class="footer-copy">Request Center • Local demo storage</div></footer><button id="topBtn">↑</button><script src="app.js"></script><script>let requests=getStored('orbitRequests',[]);const list=document.getElementById('requestList');function render(){list.innerHTML=requests.length?requests.map(r=>`<div class="quick"><b>${r.type} • ${r.priority}</b><span>${r.name}: ${r.text}</span></div>`).join(''):'<div style="color:#718197;font-size:12px">No requests yet.</div>'}document.getElementById('requestForm').addEventListener('submit',e=>{e.preventDefault();requests.unshift({name:reqName.value.trim(),contact:reqContact.value.trim(),type:reqType.value,priority:reqPriority.value,text:reqText.value.trim(),time:Date.now()});setStored('orbitRequests',requests);e.target.reset();render();toast('Request saved on this device')});render();</script></body></html>
